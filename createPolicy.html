<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Policy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <h2>InsureChain</h2>
      <a href="dashboard.html">Dashboard</a>
      <a href="createPolicy.html">Create Policy</a>
      <a href="submitClaim.html">Submit Claim</a>
      <a href="verifyClaim.html">Verify Claim</a>
      <a href="history.html">Claim History</a>
      <a href="index.html">Logout</a>
    </aside>

    <main class="main">
      <h1>Create Insurance Policy</h1>

      <div class="form-box">
        <label>Customer Wallet Address</label>
        <input type="text" placeholder="0x...">

        <label>Policy Type</label>
        <input type="text" placeholder="Health / Vehicle / Travel">

        <label>Claim Limit</label>
        <input type="number" placeholder="1000000000000000000">

        <label>Duration in Days</label>
        <input type="number" placeholder="30">

        <label>Compensation Conditions</label>
        <textarea placeholder="Enter compensation conditions..."></textarea>

        <button>Create Policy</button>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
